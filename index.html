<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recherche chantier</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151A">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- Écran 1 — Choix du client -->
  <section class="screen" id="screen-client" data-screen="client">
    <header class="topbar topbar--root">
      <h1>Recherche chantier</h1>
    </header>
    <div class="screen-body">
      <p class="intro">Choisis le donneur d'ouvrage pour commencer.</p>
      <div class="client-list">
        <button class="client-card" data-client="csem">
          <span class="client-card__name">CSEM</span>
          <span class="client-card__sub">Commission des services électriques de Montréal</span>
        </button>
        <button class="client-card" disabled>
          <span class="client-card__name">Hydro-Québec</span>
          <span class="client-card__sub">Bientôt disponible</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Écran 2 — Choix du chantier -->
  <section class="screen" id="screen-chantier" data-screen="chantier" hidden>
    <header class="topbar">
      <button class="icon-btn" data-nav="client" aria-label="Retour">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>CSEM</h1>
    </header>
    <div class="screen-body">
      <div class="chantier-list" id="chantier-list"><!-- injecté par app.js --></div>
      <button class="add-chantier" id="btn-add-chantier">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Ajouter un chantier
      </button>
    </div>
  </section>

  <!-- Écran 3 — Recherche -->
  <section class="screen" id="screen-chat" data-screen="chat" hidden>
    <header class="topbar">
      <button class="icon-btn" data-nav="chantier" aria-label="Retour">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="chat-chantier-label">Chantier</h1>
      <button class="icon-btn" data-nav="history" aria-label="Historique">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="screen-body screen-body--chat">
      <div class="thread" id="thread">
        <div class="empty-state" id="empty-state">
          <p>Décris ce que tu cherches. Un article de devis, un dessin normalisé, un code de paiement — parle, tape, ou montre une photo.</p>
        </div>
      </div>
    </div>

    <form class="composer" id="composer">
      <input id="attachment-input" type="file" accept="image/*" hidden>
      <button type="button" class="composer__btn" id="btn-camera" aria-label="Ajouter une photo">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <input type="text" id="text-input" class="composer__input" placeholder="Décris ce que tu cherches" autocomplete="off">
      <button type="button" class="composer__btn composer__btn--mic" id="btn-mic" aria-label="Recherche vocale">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="9" y="2" width="6" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="submit" class="composer__btn composer__btn--send" id="btn-send" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <div class="attachment-preview" id="attachment-preview" hidden></div>
  </section>

  <!-- Écran 4 — Historique -->
  <section class="screen" id="screen-history" data-screen="history" hidden>
    <header class="topbar">
      <button class="icon-btn" data-nav="chat" aria-label="Retour">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="history-chantier-label">Historique</h1>
    </header>
    <div class="screen-body">
      <div class="history-list" id="history-list"></div>
    </div>
  </section>

</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
